<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bte-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFB874" />
      <stop offset="100%" stop-color="#F7931A" />
    </linearGradient>
    <linearGradient id="bte-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2020" />
      <stop offset="100%" stop-color="#121414" />
    </linearGradient>
    <filter id="bte-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bte-dark-grad)" />
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="url(#bte-gold-grad)" stroke-width="4" stroke-opacity="0.3" />

